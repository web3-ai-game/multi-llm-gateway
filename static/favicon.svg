<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oeceGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#oeceGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.9" />
  <!-- Hexagon cyber contour -->
  <polygon points="32,8 53,20 53,44 32,56 11,44 11,20" stroke="url(#oeceGrad)" stroke-width="1.8" fill="rgba(15,23,42,0.6)" />
  <!-- Central Fusion 4-Point Star -->
  <path d="M32 14 C32 23 23 32 14 32 C23 32 32 41 32 50 C32 41 41 32 50 32 C41 32 32 23 32 14 Z" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="drop-shadow(0 0 3px #ffffff)"/>
</svg>
